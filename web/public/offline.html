<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4D3A">
<title>Sal's Kitchen</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #E4EEE8; color: #0E1F18;
    display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center;
  }
  main { background: #fff; border-radius: 24px; padding: 28px 24px; max-width: 360px; }
  img { width: 72px; height: 72px; border-radius: 20px; }
  h1 { font-size: 22px; margin: 12px 0 6px; color: #1E4D3A; }
  p { color: #5A6B63; margin: 0 0 20px; line-height: 1.5; }
  button { border: 0; border-radius: 12px; background: #1E4D3A; color: #fff; font: inherit; font-weight: 600; padding: 12px 20px; min-height: 44px; }
</style>
</head>
<body>
<main>
  <img src="/icon.svg" alt="">
  <h1>Sal's out of reach</h1>
  <p>Your phone isn't connected right now, so Sal can't hear you. Your chats and the week are safe. Try again once you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>
  // come back on our own as soon as the connection returns
  addEventListener("online", () => location.reload());
</script>
</body>
</html>
